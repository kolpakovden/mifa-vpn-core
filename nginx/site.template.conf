upstream mifa_ws_backend {
    server unix:/dev/shm/mifa-ws.socket;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root /var/www/__DOMAIN__;

    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://__DOMAIN__$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl ipv6only=on;
    server_name __DOMAIN__ www.__DOMAIN__;

    root /var/www/__DOMAIN__;
    index index.html;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log /var/log/nginx/__DOMAIN__.error.log;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_header_timeout 1h;
    keepalive_timeout 1h;
    grpc_connect_timeout 60s;
    grpc_read_timeout 1h;
    grpc_send_timeout 1h;

    location /__XHTTP_PATH__/ {
        access_log off;
        grpc_pass unix:/dev/shm/mifa-xhttp.socket;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header Host $host;
        grpc_socket_keepalive on;
        client_max_body_size 0;
        client_body_timeout 1h;
    }

    # Legacy compatibility transport.
    location /__WS_PATH__/ {
        access_log off;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_pass http://mifa_ws_backend;
    }

    location / { try_files $uri $uri/ =404; }
}
